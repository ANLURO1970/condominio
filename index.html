<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Importador de CSV e Excel</title>
  <!-- Biblioteca SheetJS para leitura de Excel (.xlsx, .xls) e .csv -->
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 960px;
      margin: 40px auto;
      padding: 0 20px;
      color: #1f2937;
      background-color: #f9fafb;
    }
    .card {
      background: #ffffff;
      border-radius: 10px;
      padding: 28px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }
    h1 {
      margin-top: 0;
      font-size: 22px;
    }
    .upload-area {
      border: 2px dashed #3b82f6;
      border-radius: 8px;
      padding: 36px 20px;
      text-align: center;
      background-color: #eff6ff;
      transition: background-color 0.2s, border-color 0.2s;
    }
    .upload-area.dragover {
      background-color: #dbeafe;
      border-color: #1d4ed8;
    }
    input[type="file"] {
      display: none;
    }
    .btn {
      background-color: #2563eb;
      color: #ffffff;
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      display: inline-block;
    }
    .btn:hover {
      background-color: #1d4ed8;
    }
    .btn-limpar {
      background-color: #e5e7eb;
      color: #374151;
      margin-left: 10px;
      display: none;
    }
    .btn-limpar:hover {
      background-color: #d1d5db;
    }
    #status {
      margin-top: 14px;
      font-size: 14px;
      color: #4b5563;
    }
    .erro {
      color: #dc2626 !important;
      font-weight: 500;
    }
    .sucesso {
      color: #059669 !important;
      font-weight: 500;
    }
    .table-wrapper {
      overflow-x: auto;
      margin-top: 24px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      background: #fff;
    }
    th, td {
      border: 1px solid #e5e7eb;
      padding: 10px 12px;
      text-align: left;
      white-space: nowrap;
    }
    th {
      background-color: #f3f4f6;
      font-weight: 600;
    }
    tr:nth-child(even) {
      background-color: #f9fafb;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Importar Planilha (.CSV ou Excel)</h1>

    <div class="upload-area" id="drop-zone">
      <label for="input-arquivo" class="btn">Selecionar Arquivo</label>
      <button type="button" class="btn btn-limpar" id="btn-limpar">Limpar</button>
      <input type="file" id="input-arquivo" accept=".csv, .xlsx, .xls" />
      <div id="status">Arraste um arquivo .csv, .xlsx ou .xls aqui ou clique no botão acima</div>
    </div>

    <div class="table-wrapper" id="tabela-resultado"></div>
  </div>

  <script>
    const inputArquivo = document.getElementById('input-arquivo');
    const dropZone = document.getElementById('drop-zone');
    const statusDiv = document.getElementById('status');
    const tabelaContainer = document.getElementById('tabela-resultado');
    const btnLimpar = document.getElementById('btn-limpar');

    // Suporte a arrastar e soltar (Drag & Drop)
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length > 0) {
        processarArquivo(e.dataTransfer.files[0]);
      }
    });

    // Seleção via botão
    inputArquivo.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        processarArquivo(e.target.files[0]);
      }
    });

    // Botão limpar
    btnLimpar.addEventListener('click', () => {
      inputArquivo.value = '';
      tabelaContainer.innerHTML = '';
      btnLimpar.style.display = 'none';
      statusDiv.className = '';
      statusDiv.textContent = 'Arraste um arquivo .csv, .xlsx ou .xls aqui ou clique no botão acima';
    });

    function processarArquivo(arquivo) {
      const extensoesValidas = ['.csv', '.xlsx', '.xls'];
      const nomeMinusculo = arquivo.name.toLowerCase();
      const valido = extensoesValidas.some(ext => nomeMinusculo.endsWith(ext));

      if (!valido) {
        statusDiv.className = 'erro';
        statusDiv.textContent = 'Formato inválido. Selecione um arquivo .csv, .xlsx ou .xls.';
        return;
      }

      statusDiv.className = '';
      statusDiv.textContent = `Lendo "${arquivo.name}"...`;

      const leitor = new FileReader();

      leitor.onload = function(e) {
        try {
          const dados = new Uint8Array(e.target.result);
          const workbook = XLSX.read(dados, { type: 'array' });

          const primeiraAba = workbook.SheetNames[0];
          const planilha = workbook.Sheets[primeiraAba];
          const dadosJson = XLSX.utils.sheet_to_json(planilha, { defval: '' });

          if (dadosJson.length === 0) {
            statusDiv.className = 'erro';
            statusDiv.textContent = 'O arquivo selecionado está vazio.';
            tabelaContainer.innerHTML = '';
            return;
          }

          statusDiv.className = 'sucesso';
          statusDiv.textContent = `Importado com sucesso: "${arquivo.name}" (${dadosJson.length} registros)`;
          btnLimpar.style.display = 'inline-block';

          // Array de objetos pronto para envio ao backend
          console.log('Dados importados:', dadosJson);

          renderizarTabela(dadosJson);
        } catch (erro) {
          statusDiv.className = 'erro';
          statusDiv.textContent = 'Erro ao processar o arquivo. Verifique se não está corrompido.';
          console.error(erro);
        }
      };

      leitor.readAsArrayBuffer(arquivo);
    }

    function renderizarTabela(dados) {
      const colunas = Object.keys(dados[0]);
      let html = '<table><thead><tr>';

      colunas.forEach(col => {
        html += `<th>${escaparHtml(col)}</th>`;
      });
      html += '</tr></thead><tbody>';

      dados.forEach(linha => {
        html += '<tr>';
        colunas.forEach(col => {
          html += `<td>${escaparHtml(String(linha[col]))}</td>`;
        });
        html += '</tr>';
      });

      html += '</tbody></table>';
      tabelaContainer.innerHTML = html;
    }

    function escaparHtml(texto) {
      const div = document.createElement('div');
      div.textContent = texto;
      return div.innerHTML;
    }
  </script>

</body>
</html>
